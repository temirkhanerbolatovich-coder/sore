name: Резервная копия базы

# Раз в неделю делает логическую копию боевой базы Supabase (схемы public и auth), шифрует её и
# сохраняет как артефакт этого запуска на 90 дней. На бесплатном тарифе Supabase своих копий нет.
# Заодно запрос к базе не даёт бесплатному проекту «заснуть» из-за недельной тишины.
# Нужны секреты репозитория: SUPABASE_DB_URL (адрес пула соединений с паролем) и BACKUP_PASSPHRASE
# (длинная фраза для шифрования; без неё копию не открыть, храните её отдельно). См. docs/BACKUP.md.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Проверить секреты
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::Не заданы секреты SUPABASE_DB_URL и BACKUP_PASSPHRASE (docs/BACKUP.md)"
            exit 1
          fi

      - name: Сделать копию (pg_dump 17 как у сервера)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p out
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges --format=custom --schema=public --schema=auth' > out/sore.dump
          test -s out/sore.dump
          echo "Размер копии: $(du -h out/sore.dump | cut -f1)"

      - name: Зашифровать
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$PASS" -o out/sore-$(date -u +%Y-%m-%d).dump.gpg out/sore.dump
          rm out/sore.dump
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: sore-db-backup
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error
